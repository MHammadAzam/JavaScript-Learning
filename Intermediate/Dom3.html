<script>
  // To create any element and then add its attributes aswell
  const div = document.createElement('div')
  console.log(div);
  div.setAttribute('class', 'text');
  div.className = "div1";
  div.id = "div1";
  div.setAttribute('title', 'divvv');
  div.style.backgroundColor = 'red'
  div.style.padding = '12px'
  // div.innerText = "This is a div"
  const createNode = document.createTextNode('This is a div')
  div.appendChild(createNode)


  // To show that element on webPage
  document.body.appendChild(div)
  
</script>
